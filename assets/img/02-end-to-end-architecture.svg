<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 840" width="1280" height="840" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="aBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#0078D4"/>
    </marker>
    <marker id="aPurple" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#6B4FBB"/>
    </marker>
    <marker id="aGreen" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#107C10"/>
    </marker>
    <marker id="aOrange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#B85C00"/>
    </marker>
  </defs>

  <rect width="1280" height="840" fill="#FFFFFF"/>

  <text x="640" y="40" text-anchor="middle" font-size="23" font-weight="600" fill="#1B1B1B">Windows 365 Cloud PCs mounting Azure NetApp Files in place</text>
  <text x="640" y="66" text-anchor="middle" font-size="14" fill="#5A5A5A">One dataset. Two protocols. No duplication between the desktop tier and the AI tier.</text>

  <!-- User + service -->
  <rect x="60" y="100" width="245" height="72" rx="8" fill="#FFFFFF" stroke="#8A8A8A"/>
  <text x="182" y="128" text-anchor="middle" font-size="14" font-weight="600" fill="#1B1B1B">End user, any device</text>
  <text x="182" y="150" text-anchor="middle" font-size="11" fill="#666666">Windows App or browser</text>

  <line x1="308" y1="136" x2="358" y2="136" stroke="#0078D4" stroke-width="2" marker-end="url(#aBlue)"/>
  <text x="333" y="126" text-anchor="middle" font-size="9.5" fill="#0078D4">TLS 443</text>

  <rect x="362" y="100" width="330" height="72" rx="8" fill="#EAF3FB" stroke="#0078D4"/>
  <text x="527" y="126" text-anchor="middle" font-size="14" font-weight="600" fill="#1B1B1B">Windows 365 service</text>
  <text x="527" y="148" text-anchor="middle" font-size="11" fill="#666666">gateway and Cloud PC compute, Microsoft-managed subscription</text>

  <text x="716" y="124" font-size="11.5" fill="#666666">The VM runs in Microsoft's subscription.</text>
  <text x="716" y="142" font-size="11.5" fill="#666666">Only its network interface lands in your VNet,</text>
  <text x="716" y="160" font-size="11.5" fill="#666666">and that is what makes ANF reachable.</text>

  <!-- Customer subscription container -->
  <rect x="60" y="205" width="1160" height="470" rx="12" fill="#FBFAFE" stroke="#6B4FBB"/>
  <text x="80" y="230" font-size="13" font-weight="600" fill="#6B4FBB">Your Azure subscription — UK South (Cloud PCs, DCs and ANF volumes all in the same region)</text>

  <!-- injection elbow -->
  <polyline points="527,175 527,250 262,250 262,308" fill="none" stroke="#6B4FBB" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aPurple)"/>
  <text x="392" y="243" text-anchor="middle" font-size="10.5" fill="#6B4FBB">Azure Network Connection injects the vNIC</text>

  <!-- VNet -->
  <rect x="85" y="266" width="760" height="390" rx="10" fill="#FFFFFF" stroke="#6B4FBB" stroke-dasharray="5 4"/>
  <text x="102" y="288" font-size="12.5" font-weight="600" fill="#6B4FBB">vnet-w365-hub — 10.10.0.0/16</text>

  <!-- snet-cloudpc -->
  <rect x="105" y="308" width="310" height="152" rx="8" fill="#F7FBFE" stroke="#0078D4"/>
  <text x="260" y="332" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1B1B1B">snet-cloudpc — 10.10.1.0/24</text>
  <rect x="123" y="346" width="132" height="98" rx="6" fill="#FFFFFF" stroke="#0078D4"/>
  <text x="189" y="370" text-anchor="middle" font-size="12" font-weight="600" fill="#1B1B1B">Cloud PC</text>
  <text x="189" y="390" text-anchor="middle" font-size="9.5" fill="#666666">vNIC 10.10.1.14</text>
  <text x="189" y="407" text-anchor="middle" font-size="9.5" fill="#666666">Hybrid Entra joined</text>
  <text x="189" y="428" text-anchor="middle" font-size="9.5" fill="#666666">Z: mapped at logon</text>
  <rect x="265" y="346" width="132" height="98" rx="6" fill="#FFFFFF" stroke="#0078D4"/>
  <text x="331" y="370" text-anchor="middle" font-size="12" font-weight="600" fill="#1B1B1B">Cloud PC</text>
  <text x="331" y="390" text-anchor="middle" font-size="9.5" fill="#666666">vNIC 10.10.1.15</text>
  <text x="331" y="407" text-anchor="middle" font-size="9.5" fill="#666666">one vNIC per Cloud PC</text>
  <text x="331" y="428" text-anchor="middle" font-size="9.5" fill="#666666">size the subnet for it</text>

  <!-- snet-adds -->
  <rect x="475" y="308" width="350" height="152" rx="8" fill="#FDF9F4" stroke="#B85C00"/>
  <text x="650" y="332" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1B1B1B">snet-adds — 10.10.2.0/24</text>
  <rect x="493" y="346" width="152" height="98" rx="6" fill="#FFFFFF" stroke="#B85C00"/>
  <text x="569" y="370" text-anchor="middle" font-size="12" font-weight="600" fill="#1B1B1B">DC01</text>
  <text x="569" y="390" text-anchor="middle" font-size="9.5" fill="#666666">AD DS, writable</text>
  <text x="569" y="407" text-anchor="middle" font-size="9.5" fill="#666666">AD-integrated DNS</text>
  <text x="569" y="428" text-anchor="middle" font-size="9.5" fill="#666666">AD site: ANF</text>
  <rect x="655" y="346" width="152" height="98" rx="6" fill="#FFFFFF" stroke="#B85C00"/>
  <text x="731" y="370" text-anchor="middle" font-size="12" font-weight="600" fill="#1B1B1B">DC02</text>
  <text x="731" y="390" text-anchor="middle" font-size="9.5" fill="#666666">no RODCs</text>
  <text x="731" y="407" text-anchor="middle" font-size="9.5" fill="#666666">clock skew under 5 min</text>
  <text x="731" y="428" text-anchor="middle" font-size="9.5" fill="#666666">under 10 ms RTT to ANF</text>

  <line x1="417" y1="404" x2="471" y2="404" stroke="#B85C00" stroke-width="2" marker-end="url(#aOrange)"/>
  <text x="444" y="394" text-anchor="middle" font-size="9" fill="#B85C00">88 / 389 / 53</text>

  <!-- snet-anf -->
  <rect x="105" y="490" width="720" height="148" rx="8" fill="#F5FAF5" stroke="#2E7D32"/>
  <text x="465" y="514" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1B1B1B">snet-anf — 10.10.3.0/24, delegated to Microsoft.NetApp/volumes</text>
  <rect x="125" y="526" width="680" height="96" rx="6" fill="#FFFFFF" stroke="#2E7D32"/>
  <text x="465" y="546" text-anchor="middle" font-size="10.5" fill="#2E7D32">Capacity pool — Premium service level, auto QoS</text>
  <rect x="143" y="556" width="316" height="52" rx="5" fill="#F1F8F1" stroke="#2E7D32"/>
  <text x="301" y="576" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1B1B1B">vol-projects — SMB3</text>
  <text x="301" y="594" text-anchor="middle" font-size="9.5" fill="#666666">\\anfsmb.corp.contoso.com\projects</text>
  <rect x="471" y="556" width="316" height="52" rx="5" fill="#F1F8F1" stroke="#2E7D32"/>
  <text x="629" y="576" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1B1B1B">vol-corpus — dual-protocol</text>
  <text x="629" y="594" text-anchor="middle" font-size="9.5" fill="#666666">SMB for people, NFS for the training tier</text>

  <line x1="230" y1="462" x2="230" y2="486" stroke="#107C10" stroke-width="2.5" marker-end="url(#aGreen)"/>
  <text x="243" y="479" font-size="10" fill="#107C10">SMB 3.x, TCP 445</text>

  <line x1="700" y1="488" x2="700" y2="464" stroke="#B85C00" stroke-width="2" marker-end="url(#aOrange)"/>
  <text x="712" y="481" font-size="9.5" fill="#B85C00">ANF machine account</text>

  <!-- Right column: AI spoke -->
  <rect x="870" y="266" width="330" height="182" rx="10" fill="#FFFFFF" stroke="#6B4FBB" stroke-dasharray="5 4"/>
  <text x="1035" y="290" text-anchor="middle" font-size="12.5" font-weight="600" fill="#6B4FBB">vnet-ai-spoke — VNet peered</text>
  <rect x="890" y="304" width="290" height="126" rx="6" fill="#F7F5FC" stroke="#6B4FBB"/>
  <text x="1035" y="329" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1B1B1B">AKS pods and GPU VMs</text>
  <text x="1035" y="352" text-anchor="middle" font-size="10.5" fill="#666666">Embedding, indexing, fine-tuning</text>
  <text x="1035" y="372" text-anchor="middle" font-size="10.5" fill="#666666">and inference read the same volume</text>
  <text x="1035" y="392" text-anchor="middle" font-size="10.5" fill="#666666">over NFS v3 or v4.1</text>
  <text x="1035" y="416" text-anchor="middle" font-size="10.5" font-style="italic" fill="#6B4FBB">No second copy of the corpus</text>

  <polyline points="827,582 848,582 848,367 866,367" fill="none" stroke="#107C10" stroke-width="2.5" marker-end="url(#aGreen)"/>
  <text x="856" y="502" font-size="10" fill="#107C10">NFS</text>

  <!-- Right column: flows -->
  <rect x="870" y="472" width="330" height="166" rx="10" fill="#FFFFFF" stroke="#8A8A8A"/>
  <text x="890" y="496" font-size="12.5" font-weight="600" fill="#1B1B1B">Flows you have to allow</text>
  <text x="890" y="521" font-size="11" fill="#444444">445 — SMB3, Cloud PC to ANF</text>
  <text x="890" y="543" font-size="11" fill="#444444">88 and 464 — Kerberos to the DCs</text>
  <text x="890" y="565" font-size="11" fill="#444444">389, 3268, 3269 — LDAP and GC</text>
  <text x="890" y="587" font-size="11" fill="#444444">53 — AD-integrated DNS</text>
  <text x="890" y="609" font-size="11" fill="#444444">443 — Windows 365 service endpoints</text>
  <text x="890" y="629" font-size="10" font-style="italic" fill="#8A8A8A">Do not hairpin 443 through on-premises egress</text>

  <!-- On-premises -->
  <rect x="60" y="712" width="430" height="96" rx="10" fill="#FFFFFF" stroke="#8A8A8A"/>
  <text x="275" y="740" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1B1B1B">On-premises forest and legacy file estate</text>
  <text x="275" y="762" text-anchor="middle" font-size="11" fill="#666666">Optional. Needed only for hybrid join and on-premises identity.</text>
  <text x="275" y="782" text-anchor="middle" font-size="11" fill="#666666">Consider replica DCs in Azure rather than trusting the WAN.</text>

  <line x1="275" y1="710" x2="275" y2="682" stroke="#8A8A8A" stroke-width="2" marker-end="url(#aPurple)"/>
  <text x="288" y="700" font-size="10.5" fill="#666666">ExpressRoute or site-to-site VPN, gateway transit</text>

  <text x="640" y="770" text-anchor="middle" font-size="12.5" font-style="italic" fill="#5A5A5A">The desktop moves to the data. The data does not move to the desktop.</text>
</svg>
