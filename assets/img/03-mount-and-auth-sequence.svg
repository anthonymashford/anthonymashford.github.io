<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 700" width="1220" height="700" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="sArr" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#444444"/>
    </marker>
  </defs>

  <rect width="1220" height="700" fill="#FFFFFF"/>

  <text x="610" y="38" text-anchor="middle" font-size="23" font-weight="600" fill="#1B1B1B">What actually happens when the drive maps</text>
  <text x="610" y="64" text-anchor="middle" font-size="14" fill="#5A5A5A">Kerberos does the work. The Azure Network Connection is what gives it somewhere to do it.</text>

  <!-- lanes -->
  <rect x="60" y="92" width="200" height="58" rx="8" fill="#F5F5F5" stroke="#8A8A8A"/>
  <text x="160" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#1B1B1B">User</text>
  <text x="160" y="137" text-anchor="middle" font-size="10" fill="#666666">signing in to the Cloud PC</text>

  <rect x="330" y="92" width="220" height="58" rx="8" fill="#EAF3FB" stroke="#0078D4"/>
  <text x="440" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#1B1B1B">Cloud PC</text>
  <text x="440" y="137" text-anchor="middle" font-size="10" fill="#666666">vNIC 10.10.1.14 in your VNet</text>

  <rect x="630" y="92" width="220" height="58" rx="8" fill="#FDF9F4" stroke="#B85C00"/>
  <text x="740" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#1B1B1B">AD DS</text>
  <text x="740" y="137" text-anchor="middle" font-size="10" fill="#666666">KDC and AD-integrated DNS</text>

  <rect x="930" y="92" width="230" height="58" rx="8" fill="#F1F8F1" stroke="#2E7D32"/>
  <text x="1045" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#1B1B1B">ANF SMB server</text>
  <text x="1045" y="137" text-anchor="middle" font-size="10" fill="#666666">anfsmb.corp.contoso.com</text>

  <!-- lifelines -->
  <line x1="160" y1="152" x2="160" y2="600" stroke="#C9C9C9" stroke-width="1.5" stroke-dasharray="4 5"/>
  <line x1="440" y1="152" x2="440" y2="600" stroke="#C9C9C9" stroke-width="1.5" stroke-dasharray="4 5"/>
  <line x1="740" y1="152" x2="740" y2="600" stroke="#C9C9C9" stroke-width="1.5" stroke-dasharray="4 5"/>
  <line x1="1045" y1="152" x2="1045" y2="600" stroke="#C9C9C9" stroke-width="1.5" stroke-dasharray="4 5"/>

  <!-- step 1 -->
  <circle cx="88" cy="192" r="11" fill="#0078D4"/><text x="88" y="196" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">1</text>
  <line x1="160" y1="192" x2="434" y2="192" stroke="#444444" stroke-width="1.6" marker-end="url(#sArr)"/>
  <text x="297" y="184" text-anchor="middle" font-size="11.5" fill="#1B1B1B">Sign in with Entra ID, single sign-on into the session</text>

  <!-- step 2 -->
  <circle cx="88" cy="242" r="11" fill="#0078D4"/><text x="88" y="246" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">2</text>
  <line x1="440" y1="242" x2="734" y2="242" stroke="#444444" stroke-width="1.6" marker-end="url(#sArr)"/>
  <text x="587" y="234" text-anchor="middle" font-size="11.5" fill="#1B1B1B">AS-REQ over the ANC path, ticket-granting ticket issued</text>

  <!-- step 3 -->
  <circle cx="88" cy="292" r="11" fill="#0078D4"/><text x="88" y="296" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">3</text>
  <line x1="440" y1="292" x2="734" y2="292" stroke="#444444" stroke-width="1.6" marker-end="url(#sArr)"/>
  <text x="587" y="284" text-anchor="middle" font-size="11.5" fill="#1B1B1B">DNS: anfsmb.corp.contoso.com resolves to 10.10.3.4</text>

  <!-- step 4 -->
  <circle cx="88" cy="342" r="11" fill="#0078D4"/><text x="88" y="346" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">4</text>
  <line x1="440" y1="342" x2="734" y2="342" stroke="#444444" stroke-width="1.6" marker-end="url(#sArr)"/>
  <text x="587" y="334" text-anchor="middle" font-size="11.5" fill="#1B1B1B">TGS-REQ for cifs/anfsmb.corp.contoso.com</text>

  <!-- step 5 -->
  <circle cx="88" cy="392" r="11" fill="#0078D4"/><text x="88" y="396" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">5</text>
  <line x1="740" y1="392" x2="446" y2="392" stroke="#444444" stroke-width="1.6" marker-end="url(#sArr)"/>
  <text x="593" y="384" text-anchor="middle" font-size="11.5" fill="#1B1B1B">Service ticket returned to the Cloud PC</text>

  <!-- step 6 -->
  <circle cx="88" cy="442" r="11" fill="#107C10"/><text x="88" y="446" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">6</text>
  <line x1="440" y1="442" x2="1039" y2="442" stroke="#107C10" stroke-width="2" marker-end="url(#sArr)"/>
  <text x="740" y="434" text-anchor="middle" font-size="11.5" font-weight="600" fill="#107C10">SMB3 negotiate and session setup on TCP 445, ticket presented</text>

  <!-- step 7 -->
  <circle cx="88" cy="492" r="11" fill="#B85C00"/><text x="88" y="496" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">7</text>
  <line x1="1045" y1="492" x2="746" y2="492" stroke="#444444" stroke-width="1.6" marker-end="url(#sArr)"/>
  <text x="895" y="484" text-anchor="middle" font-size="11.5" fill="#1B1B1B">ANF validates against its own machine account, resolves SIDs</text>

  <!-- step 8 -->
  <circle cx="88" cy="542" r="11" fill="#107C10"/><text x="88" y="546" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">8</text>
  <line x1="1045" y1="542" x2="446" y2="542" stroke="#444444" stroke-width="1.6" marker-end="url(#sArr)"/>
  <text x="745" y="534" text-anchor="middle" font-size="11.5" fill="#1B1B1B">Tree connect granted, NTFS ACLs applied per user</text>

  <!-- step 9 -->
  <circle cx="88" cy="592" r="11" fill="#107C10"/><text x="88" y="596" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">9</text>
  <line x1="440" y1="592" x2="166" y2="592" stroke="#444444" stroke-width="1.6" marker-end="url(#sArr)"/>
  <text x="303" y="584" text-anchor="middle" font-size="11.5" fill="#1B1B1B">Z: appears, pointing at 40 TiB nobody had to copy</text>

  <rect x="60" y="626" width="1100" height="52" rx="8" fill="#FAFAFA" stroke="#D9D9D9"/>
  <text x="80" y="649" font-size="11.5" fill="#444444">Every hop after step 1 stays on private IPs inside your virtual network. ANF holds its own machine account in AD DS, created when you configure the</text>
  <text x="80" y="668" font-size="11.5" fill="#444444">Active Directory connection on the NetApp account, and it discovers domain controllers using the AD site name you supply there.</text>
</svg>
