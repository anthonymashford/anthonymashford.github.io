<svg viewBox="0 0 1400 820" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif">

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>

    <linearGradient id="anfGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0078D4"/>
      <stop offset="1" stop-color="#003F7C"/>
    </linearGradient>

    <linearGradient id="apiGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#50E6FF"/>
      <stop offset="1" stop-color="#0099CC"/>
    </linearGradient>

    <linearGradient id="fileFlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B21B6"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient id="objectFlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0E7490"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="heroShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <marker id="arrowFile" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M 0 0 L 9 5.5 L 0 11 z" fill="#5B21B6"/>
    </marker>
    <marker id="arrowObject" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M 0 0 L 9 5.5 L 0 11 z" fill="#0E7490"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="820" fill="url(#bgGrad)"/>

  <!-- ============== TITLE ============== -->
  <text x="700" y="60" text-anchor="middle" font-size="34" font-weight="700" fill="#1B2D3D" letter-spacing="-0.5">Azure NetApp Files — File / Object Duality</text>
  <text x="700" y="95" text-anchor="middle" font-size="18" font-weight="400" fill="#64748B">One dataset. Two access patterns. Zero copies.</text>

  <!-- ============== LEFT COLUMN HEADER ============== -->
  <text x="190" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#5B21B6" letter-spacing="3">FILE PROTOCOL CLIENTS</text>
  <line x1="100" y1="170" x2="280" y2="170" stroke="#5B21B6" stroke-width="2" opacity="0.4"/>

  <!-- HPC Compute card -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="200" width="260" height="105" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <g transform="translate(163, 212)">
      <rect x="0"  y="0"  width="14" height="14" rx="2" fill="#5B21B6"/>
      <rect x="20" y="0"  width="14" height="14" rx="2" fill="#5B21B6"/>
      <rect x="40" y="0"  width="14" height="14" rx="2" fill="#5B21B6"/>
      <rect x="0"  y="20" width="14" height="14" rx="2" fill="#7C3AED"/>
      <rect x="20" y="20" width="14" height="14" rx="2" fill="#7C3AED"/>
      <rect x="40" y="20" width="14" height="14" rx="2" fill="#7C3AED"/>
    </g>
    <text x="190" y="272" text-anchor="middle" font-size="17" font-weight="600" fill="#1B2D3D">HPC Compute</text>
    <text x="190" y="293" text-anchor="middle" font-size="12" fill="#64748B">Parallel analysis &amp; simulation</text>
  </g>

  <!-- Sequencers card -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="325" width="260" height="105" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <g transform="translate(175, 337)" stroke="#5B21B6" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M 5 0 C 5 10, 35 10, 35 15 C 35 20, 5 20, 5 30"/>
      <path d="M 35 0 C 35 10, 5 10, 5 15 C 5 20, 35 20, 35 30"/>
      <line x1="9" y1="7" x2="31" y2="7"/>
      <line x1="9" y1="23" x2="31" y2="23"/>
    </g>
    <text x="190" y="397" text-anchor="middle" font-size="17" font-weight="600" fill="#1B2D3D">Sequencers</text>
    <text x="190" y="418" text-anchor="middle" font-size="12" fill="#64748B">BAM, CRAM, VCF, FASTQ</text>
  </g>

  <!-- App servers card -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="450" width="260" height="105" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <g transform="translate(165, 463)">
      <rect x="0" y="0"  width="50" height="10" rx="2" fill="#5B21B6"/>
      <circle cx="6" cy="5" r="1.8" fill="#FFF"/>
      <rect x="0" y="14" width="50" height="10" rx="2" fill="#7C3AED"/>
      <circle cx="6" cy="19" r="1.8" fill="#FFF"/>
      <rect x="0" y="28" width="50" height="10" rx="2" fill="#5B21B6"/>
      <circle cx="6" cy="33" r="1.8" fill="#FFF"/>
    </g>
    <text x="190" y="522" text-anchor="middle" font-size="17" font-weight="600" fill="#1B2D3D">App Servers</text>
    <text x="190" y="543" text-anchor="middle" font-size="12" fill="#64748B">Enterprise workloads</text>
  </g>

  <!-- ============== LEFT ARROWS (NFS / SMB) ============== -->
  <g>
    <line x1="335" y1="378" x2="535" y2="378" stroke="url(#fileFlow)" stroke-width="4" marker-end="url(#arrowFileEnd)" stroke-linecap="round"/>
    <line x1="535" y1="402" x2="335" y2="402" stroke="url(#fileFlow)" stroke-width="4" marker-end="url(#arrowFileStart)" stroke-linecap="round"/>
    <rect x="365" y="328" width="140" height="32" rx="16" fill="#5B21B6" filter="url(#cardShadow)"/>
    <text x="435" y="349" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="1">NFS / SMB</text>
  </g>

  <!-- ============== ANF CENTRAL HERO ============== -->
  <g filter="url(#heroShadow)">
    <rect x="540" y="195" width="320" height="380" rx="20" fill="url(#anfGrad)"/>

    <text x="700" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#50E6FF" letter-spacing="3">AZURE NETAPP FILES</text>
    <text x="700" y="275" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">Volume</text>

    <!-- Volume "disk" visual -->
    <g transform="translate(700, 340)">
      <ellipse cx="0" cy="0"   rx="90" ry="20" fill="#50E6FF" opacity="0.25"/>
      <ellipse cx="0" cy="-12" rx="90" ry="20" fill="#50E6FF" opacity="0.35"/>
      <ellipse cx="0" cy="-24" rx="90" ry="20" fill="#FFFFFF" opacity="0.95"/>
      <ellipse cx="0" cy="-24" rx="90" ry="20" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
      <text x="0" y="-19" text-anchor="middle" font-size="12" font-weight="700" fill="#0078D4" letter-spacing="2">SINGLE COPY</text>
    </g>

    <!-- Object REST API sub-card -->
    <rect x="565" y="395" width="270" height="80" rx="12" fill="url(#apiGrad)"/>
    <text x="700" y="424" text-anchor="middle" font-size="15" font-weight="700" fill="#003F7C" letter-spacing="1">OBJECT REST API</text>
    <text x="700" y="446" text-anchor="middle" font-size="12" font-weight="500" fill="#003F7C">S3-compatible bucket abstraction</text>
    <text x="700" y="464" text-anchor="middle" font-size="11" font-weight="400" fill="#003F7C" opacity="0.85">TLS · certificate trust · access keys</text>

    <!-- Foundation strip -->
    <rect x="565" y="500" width="270" height="55" rx="10" fill="#FFFFFF" opacity="0.12"/>
    <text x="700" y="523" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.5" opacity="0.95">ENTERPRISE PERFORMANCE</text>
    <text x="700" y="543" text-anchor="middle" font-size="11" font-weight="400" fill="#FFFFFF" opacity="0.75">snapshots · replication · VNet · encryption</text>
  </g>

  <!-- ============== RIGHT ARROWS (S3 REST) ============== -->
  <g>
    <line x1="865" y1="378" x2="1065" y2="378" stroke="url(#objectFlow)" stroke-width="4" marker-end="url(#arrowObjectEnd)" stroke-linecap="round"/>
    <line x1="1065" y1="402" x2="865" y2="402" stroke="url(#objectFlow)" stroke-width="4" marker-end="url(#arrowObjectStart)" stroke-linecap="round"/>
    <rect x="870" y="328" width="190" height="32" rx="16" fill="#0E7490" filter="url(#cardShadow)"/>
    <text x="965" y="349" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="1">S3-COMPATIBLE REST</text>
  </g>

  <!-- ============== RIGHT COLUMN HEADER ============== -->
  <text x="1210" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#0E7490" letter-spacing="3">OBJECT PROTOCOL CLIENTS</text>
  <line x1="1110" y1="170" x2="1310" y2="170" stroke="#0E7490" stroke-width="2" opacity="0.4"/>

  <!-- Databricks card -->
  <g filter="url(#cardShadow)">
    <rect x="1080" y="200" width="260" height="105" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <g transform="translate(1194, 213)">
      <line x1="3"  y1="3"  x2="16" y2="14" stroke="#0E7490" stroke-width="1.5"/>
      <line x1="29" y1="3"  x2="16" y2="14" stroke="#0E7490" stroke-width="1.5"/>
      <line x1="3"  y1="25" x2="16" y2="14" stroke="#0E7490" stroke-width="1.5"/>
      <line x1="29" y1="25" x2="16" y2="14" stroke="#0E7490" stroke-width="1.5"/>
      <circle cx="3"  cy="3"  r="4" fill="#0EA5E9"/>
      <circle cx="29" cy="3"  r="4" fill="#0EA5E9"/>
      <circle cx="3"  cy="25" r="4" fill="#0EA5E9"/>
      <circle cx="29" cy="25" r="4" fill="#0EA5E9"/>
      <circle cx="16" cy="14" r="6" fill="#0E7490"/>
    </g>
    <text x="1210" y="272" text-anchor="middle" font-size="17" font-weight="600" fill="#1B2D3D">Azure Databricks</text>
    <text x="1210" y="293" text-anchor="middle" font-size="12" fill="#64748B">Spark analytics &amp; ML</text>
  </g>

  <!-- OneLake card -->
  <g filter="url(#cardShadow)">
    <rect x="1080" y="325" width="260" height="105" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <g transform="translate(1180, 340)" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M 0 0  Q 10 -8, 20 0  T 40 0  T 60 0"  stroke="#0E7490"/>
      <path d="M 0 11 Q 10  3, 20 11 T 40 11 T 60 11" stroke="#0EA5E9"/>
      <path d="M 0 22 Q 10 14, 20 22 T 40 22 T 60 22" stroke="#0E7490"/>
    </g>
    <text x="1210" y="397" text-anchor="middle" font-size="17" font-weight="600" fill="#1B2D3D">OneLake</text>
    <text x="1210" y="418" text-anchor="middle" font-size="12" fill="#64748B">Fabric shortcuts &amp; governance</text>
  </g>

  <!-- AI agents card -->
  <g filter="url(#cardShadow)">
    <rect x="1080" y="450" width="260" height="105" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <g transform="translate(1195, 463)">
      <path d="M 15 0 L 17.5 12.5 L 30 15 L 17.5 17.5 L 15 30 L 12.5 17.5 L 0 15 L 12.5 12.5 Z" fill="#0E7490"/>
      <circle cx="28" cy="4"  r="2"   fill="#0EA5E9"/>
      <circle cx="2"  cy="26" r="1.5" fill="#0EA5E9"/>
    </g>
    <text x="1210" y="522" text-anchor="middle" font-size="17" font-weight="600" fill="#1B2D3D">AI Agents</text>
    <text x="1210" y="543" text-anchor="middle" font-size="12" fill="#64748B">Discovery, RAG, inference</text>
  </g>

  <!-- ============== BOTTOM STRIP — VALUE BANNER ============== -->
  <g transform="translate(0, 640)">
    <rect x="60" y="0" width="1280" height="120" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#cardShadow)"/>

    <g transform="translate(150, 60)">
      <circle cx="0" cy="0" r="22" fill="#EEF2FF"/>
      <text x="0" y="8" text-anchor="middle" font-size="22" font-weight="700" fill="#5B21B6">1</text>
      <text x="38" y="-4" font-size="16" font-weight="700" fill="#1B2D3D">Single copy of data</text>
      <text x="38" y="18" font-size="12" fill="#64748B">No duplicate storage, no drift</text>
    </g>

    <g transform="translate(580, 60)">
      <circle cx="0" cy="0" r="22" fill="#E0F2FE"/>
      <text x="0" y="8" text-anchor="middle" font-size="22" font-weight="700" fill="#0078D4">2</text>
      <text x="38" y="-4" font-size="16" font-weight="700" fill="#1B2D3D">Dual protocol access</text>
      <text x="38" y="18" font-size="12" fill="#64748B">NFS/SMB and S3 on the same volume</text>
    </g>

    <g transform="translate(1000, 60)">
      <circle cx="0" cy="0" r="22" fill="#CFFAFE"/>
      <text x="0" y="8" text-anchor="middle" font-size="22" font-weight="700" fill="#0E7490">3</text>
      <text x="38" y="-4" font-size="16" font-weight="700" fill="#1B2D3D">Zero data movement</text>
      <text x="38" y="18" font-size="12" fill="#64748B">Analytics meets the data, in place</text>
    </g>
  </g>

</svg>
