<svg viewBox="0 0 1200 660" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7fafd"/>
      <stop offset="1" stop-color="#eef4fa"/>
    </linearGradient>
    <linearGradient id="host" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9f1fb"/>
    </linearGradient>
    <linearGradient id="anf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a7d3e"/>
      <stop offset="1" stop-color="#075e2e"/>
    </linearGradient>
    <linearGradient id="anfTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13a455"/>
      <stop offset="1" stop-color="#0a7d3e"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0a66c2"/>
    </marker>
    <marker id="arrowThin" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c2410c"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0a2540" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="660" fill="url(#bg)"/>

  <!-- Title -->
  <text x="600" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#0a2540">NFS nconnect on Azure VMware Solution with Azure NetApp Files</text>
  <text x="600" y="78" text-anchor="middle" font-size="16" fill="#5a6b7b">Per&#8209;datastore parallelism: one ESXi host, one NFS datastore, more TCP connections</text>

  <!-- Divider -->
  <line x1="600" y1="110" x2="600" y2="610" stroke="#cdd9e5" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- ===================== LEFT: nconnect=1 ===================== -->
  <text x="300" y="138" text-anchor="middle" font-size="20" font-weight="700" fill="#c2410c">Before &#183; nconnect=1</text>
  <text x="300" y="162" text-anchor="middle" font-size="14" fill="#5a6b7b">A single TCP connection per datastore</text>

  <!-- ESXi host (left) -->
  <g filter="url(#soft)">
    <rect x="70" y="240" width="170" height="120" rx="12" fill="url(#host)" stroke="#9db8d6" stroke-width="1.5"/>
  </g>
  <rect x="70" y="240" width="170" height="30" rx="12" fill="#0a66c2"/>
  <rect x="70" y="256" width="170" height="14" fill="#0a66c2"/>
  <text x="155" y="261" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">AVS ESXi host</text>
  <text x="155" y="300" text-anchor="middle" font-size="12" fill="#33475b">VMs &#183; VMDKs</text>
  <rect x="92" y="312" width="38" height="28" rx="4" fill="#dbe7f4" stroke="#9db8d6"/>
  <rect x="136" y="312" width="38" height="28" rx="4" fill="#dbe7f4" stroke="#9db8d6"/>
  <rect x="180" y="312" width="38" height="28" rx="4" fill="#dbe7f4" stroke="#9db8d6"/>

  <!-- single connection -->
  <line x1="240" y1="300" x2="430" y2="300" stroke="#c2410c" stroke-width="5" marker-end="url(#arrowThin)"/>
  <text x="335" y="288" text-anchor="middle" font-size="13" font-weight="600" fill="#c2410c">1 TCP flow</text>
  <text x="335" y="322" text-anchor="middle" font-size="12" fill="#9a4a2a">queuing &#183; flow control</text>

  <!-- ANF datastore (left) -->
  <g filter="url(#soft)">
    <path d="M440 280 a60 18 0 0 0 120 0 v60 a60 18 0 0 1 -120 0 Z" fill="url(#anf)"/>
    <ellipse cx="500" cy="280" rx="60" ry="18" fill="url(#anfTop)"/>
  </g>
  <text x="500" y="285" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">ANF</text>
  <text x="500" y="392" text-anchor="middle" font-size="13" font-weight="600" fill="#0a2540">Azure NetApp Files</text>
  <text x="500" y="410" text-anchor="middle" font-size="12" fill="#5a6b7b">NFSv3 datastore</text>

  <!-- left ceiling note -->
  <rect x="120" y="470" width="360" height="92" rx="10" fill="#fff5ef" stroke="#f0c9b3"/>
  <text x="300" y="498" text-anchor="middle" font-size="14" font-weight="700" fill="#c2410c">Single&#8209;connection ceiling</text>
  <text x="300" y="522" text-anchor="middle" font-size="13" fill="#5a4036">~76,000 IOPS from one datastore per host.</text>
  <text x="300" y="542" text-anchor="middle" font-size="13" fill="#5a4036">Scaling meant adding more datastores.</text>

  <!-- ===================== RIGHT: nconnect=4 ===================== -->
  <text x="900" y="138" text-anchor="middle" font-size="20" font-weight="700" fill="#0a7d3e">After &#183; nconnect=4</text>
  <text x="900" y="162" text-anchor="middle" font-size="14" fill="#5a6b7b">Four parallel TCP connections per datastore</text>

  <!-- ESXi host (right) -->
  <g filter="url(#soft)">
    <rect x="660" y="240" width="170" height="120" rx="12" fill="url(#host)" stroke="#9db8d6" stroke-width="1.5"/>
  </g>
  <rect x="660" y="240" width="170" height="30" rx="12" fill="#0a66c2"/>
  <rect x="660" y="256" width="170" height="14" fill="#0a66c2"/>
  <text x="745" y="261" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">AVS ESXi host</text>
  <text x="745" y="300" text-anchor="middle" font-size="12" fill="#33475b">VMs &#183; VMDKs</text>
  <rect x="682" y="312" width="38" height="28" rx="4" fill="#dbe7f4" stroke="#9db8d6"/>
  <rect x="726" y="312" width="38" height="28" rx="4" fill="#dbe7f4" stroke="#9db8d6"/>
  <rect x="770" y="312" width="38" height="28" rx="4" fill="#dbe7f4" stroke="#9db8d6"/>

  <!-- four parallel connections -->
  <line x1="830" y1="262" x2="1020" y2="282" stroke="#0a7d3e" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="830" y1="288" x2="1020" y2="296" stroke="#0a7d3e" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="830" y1="314" x2="1020" y2="310" stroke="#0a7d3e" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="830" y1="340" x2="1020" y2="324" stroke="#0a7d3e" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="925" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#0a7d3e">4 parallel TCP flows</text>
  <text x="925" y="360" text-anchor="middle" font-size="12" fill="#0a7d3e">more I/O in flight &#183; less queuing</text>

  <!-- ANF datastore (right) -->
  <g filter="url(#soft)">
    <path d="M1030 280 a60 18 0 0 0 120 0 v60 a60 18 0 0 1 -120 0 Z" fill="url(#anf)"/>
    <ellipse cx="1090" cy="280" rx="60" ry="18" fill="url(#anfTop)"/>
  </g>
  <text x="1090" y="285" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">ANF</text>
  <text x="1090" y="392" text-anchor="middle" font-size="13" font-weight="600" fill="#0a2540">Azure NetApp Files</text>
  <text x="1090" y="410" text-anchor="middle" font-size="12" fill="#5a6b7b">same NFSv3 datastore</text>

  <!-- right gain note -->
  <rect x="720" y="470" width="360" height="92" rx="10" fill="#eefaf1" stroke="#a9dcbb"/>
  <text x="900" y="498" text-anchor="middle" font-size="14" font-weight="700" fill="#0a7d3e">One datastore, &#8776;4&#215; the headroom</text>
  <text x="900" y="522" text-anchor="middle" font-size="13" fill="#2c4a38">Approaches what previously needed ~4 datastores.</text>
  <text x="900" y="542" text-anchor="middle" font-size="13" fill="#2c4a38">No VM or application changes required.</text>

  <!-- footer -->
  <text x="600" y="630" text-anchor="middle" font-size="12" fill="#8090a0">Supported on AVS Gen 1 &amp; Gen 2 &#183; vSphere 8.0 U2+ &#183; combine with up to 64 datastores per cluster for further scale</text>
</svg>
